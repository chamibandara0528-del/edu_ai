                </button>

    <!-- Bottom Navigation Bar as requested -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-4 py-2 flex justify-around items-center shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
        
        <!-- Home Item -->
        <a href="/" class="flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-600 transition-all">
            <span class="text-xl">🏠</span>
            <span class="bottom-nav-text text-[10px] font-bold uppercase tracking-wider text-slate-400">Home</span>
        </a>

        <!-- Edu.AI Item -->
        <a href="/?view=robot" class="flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-600 transition-all">
            <span class="text-xl">🤖</span>
            <span class="bottom-nav-text text-[10px] font-bold uppercase tracking-wider text-slate-400">Edu.AI</span>
        </a>

        <!-- Notes Item (Active State with green highlight) -->
        <a href="#" class="flex flex-col items-center gap-1 py-1.5 px-4 bg-primary-50 text-primary-600 rounded-2xl scale-105 shadow-sm transition-all border border-primary-200/40">
            <span class="text-xl">📝</span>
            <span class="bottom-nav-text text-[10px] font-black uppercase tracking-widest text-primary-600">Notes</span>
        </a>

        <!-- Progress Item -->
        <a href="/?view=profile" class="flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-600 transition-all">
            <span class="text-xl">📊</span>
            <span class="bottom-nav-text text-[10px] font-bold uppercase tracking-wider text-slate-400">Progress</span>
        </a>

    </nav>

    <!-- Simple, Elegant Interactive Logic -->
    <script>
        // Localstorage Key
        const NOTES_STORAGE_KEY = 'np_quick_notes_list';

        // Load saved notes on start
        document.addEventListener('DOMContentLoaded', () => {
            renderSavedNotes();
        });

        // Trigger toast message
        function showToast(msg, icon = '✨') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastIcon.innerText = icon;
            toastMsg.innerText = msg;
            
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }

        // Get saved notes
        function getSavedNotes() {
            try {
                return JSON.parse(localStorage.getItem(NOTES_STORAGE_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        // Save a new note
        function saveNote() {
            const grade = document.getElementById('gradeSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const term = document.getElementById('termSelect').value;
            const content = document.getElementById('noteTextarea').value.trim();

            if (!content) {
                showToast('කරුණාකර සටහනක් ලියන්න! (Please write a note!)', '⚠️');
                return;
            }

            const notes = getSavedNotes();
            const newNote = {
                id: Date.now().toString(),
                grade,
                subject,
                term,
                content,
                timestamp: new Date().toLocaleString('si-LK')
            };

            notes.unshift(newNote);
            localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(notes));

            // Visual feedback
            showToast('සටහන සාර්ථකව සුරැකුණා! (Note saved successfully!)', '✅');
            document.getElementById('noteTextarea').value = '';
            
            // Re-render
            renderSavedNotes();
            
            // Add custom sparky confetti effect using standard elements if required, or celebrate elegantly
            const btn = document.getElementById('saveNoteButton');
            btn.classList.add('scale-95');
            setTimeout(() => btn.classList.remove('scale-95'), 100);
        }

        // Render notes list
        function renderSavedNotes() {
            const notes = getSavedNotes();
            const list = document.getElementById('savedNotesList');
            const badge = document.getElementById('savedNotesBadge');
            
            badge.innerText = notes.length;

            if (notes.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-10 text-slate-400 font-bold text-sm">
                        කිසිදු සටහනක් නොමැත.<br><span class="text-xs font-semibold text-slate-300">(No saved notes yet.)</span>
                    </div>
                `;
                return;
            }

            list.innerHTML = notes.map(n => `
                <div class="p-4 bg-slate-50 border border-slate-100 rounded-2xl relative group hover:shadow-md transition-all">
                    <button onclick="deleteNote('${n.id}')" class="absolute top-3 right-3 text-slate-400 hover:text-rose-600 transition-all text-xs">
                        🗑️
                    </button>
                    <div class="flex flex-wrap gap-1.5 mb-2">
                        <span class="px-2 py-0.5 bg-primary-100 text-primary-800 text-[9px] font-black rounded-md">${n.grade}</span>
                        <span class="px-2 py-0.5 bg-sky-100 text-sky-800 text-[9px] font-black rounded-md max-w-[150px] truncate" title="${n.subject}">${n.subject}</span>
                        <span class="px-2 py-0.5 bg-amber-100 text-amber-800 text-[9px] font-black rounded-md">${n.term}</span>
                    </div>
                    <p class="text-xs text-slate-600 leading-relaxed font-medium whitespace-pre-wrap mt-2 select-text">${escapeHtml(n.content)}</p>
                    <div class="text-[9px] text-slate-400 font-bold mt-3 border-t border-slate-100/50 pt-2 flex justify-between items-center">
                        <span>🕒 ${n.timestamp}</span>
                        <button onclick="loadNoteIntoForm('${n.id}')" class="text-primary-600 hover:underline font-black">Edit 📝</button>
                    </div>
                </div>
            `).join('');
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Delete individual note
        function deleteNote(id) {
            let notes = getSavedNotes();
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(notes));
            showToast('සටහන මකා දැමුවා! (Note deleted!)', '🗑️');
            renderSavedNotes();
        }

        // Load note into active editor form
        function loadNoteIntoForm(id) {
            const notes = getSavedNotes();
            const note = notes.find(n => n.id === id);
            if (note) {
                document.getElementById('gradeSelect').value = note.grade;
                document.getElementById('subjectSelect').value = note.subject;
                document.getElementById('termSelect').value = note.term;
                document.getElementById('noteTextarea').value = note.content;
                toggleSavedNotesDrawer();
                showToast('සටහන සංස්කරණයට සුදානම්! (Loaded for editing!)', '✍️');
            }
        }

        // Toggle saved notes side drawer
        function toggleSavedNotesDrawer() {
            const overlay = document.getElementById('drawerOverlay');
            const content = document.getElementById('drawerContent');

            if (overlay.classList.contains('hidden')) {
                overlay.classList.remove('hidden');
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    content.classList.remove('translate-x-full');
                }, 10);
            } else {
                overlay.classList.add('opacity-0');
                content.classList.add('translate-x-full');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 300);
            }
        }

        // Download notes as text file
        function exportNotesToTxt() {
            const notes = getSavedNotes();
            if (notes.length === 0) {
                showToast('බාගත කිරීමට සටහන් නොමැත! (No notes to download!)', '⚠️');
                return;
            }

            let textContent = "=== නැණසල QUICK NOTES REPORT ===\n\n";
            notes.forEach((n, idx) => {
                textContent += `Note #${idx + 1}\n`;
                textContent += `Grade  : ${n.grade}\n`;
                textContent += `Subject: ${n.subject}\n`;
                textContent += `Term   : ${n.term}\n`;
                textContent += `Time   : ${n.timestamp}\n`;
                textContent += `----------------------------------------\n`;
                textContent += `${n.content}\n`;
                textContent += `========================================\n\n`;
            });

            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Nanasala_Quick_Notes_${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('බාගැනීම සාර්ථකයි! (Downloaded successfully!)', '📥');
        }

        // Clear entire form
        function clearCurrentForm() {
            document.getElementById('noteTextarea').value = '';
            showToast('ආකෘතිය හිස් කළා! (Form cleared!)', '🔄');
        }

        // Clear all saved notes
        function clearAllNotes() {
            if (confirm('සැබවින්ම සියලුම සටහන් මකා දැමීමට අවශ්‍යද? (Are you sure you want to delete all notes?)')) {
                localStorage.removeItem(NOTES_STORAGE_KEY);
                showToast('සියලුම සටහන් මකා දැමුවා! (All notes deleted!)', '🗑️');
                renderSavedNotes();
            }
        }
    </script>
</body>
</html>
